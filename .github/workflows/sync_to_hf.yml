name: Sync to Hugging Face hub

on:
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.GITHUB_HF_SYNC }}
        run: |
          git push https://mkam0904:$HF_TOKEN@huggingface.co/spaces/mkam0904/my-Digital-Twin main